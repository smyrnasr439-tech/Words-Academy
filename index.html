<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أكاديمية الكلمات الذكية</title>
  
  <!-- استدعاء المكتبات الرسمية المستقرة عبر الـ CDN لضمان التشغيل الفوري -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
    body {
      font-family: 'Tajawal', sans-serif;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.4s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  
  <!-- الحاوية الأساسية للتطبيق -->
  <div id="root"></div>

  <!-- تم تعديل النوع إلى text/babel بشكل صحيح ليتعرف عليه المتصفح فوراً -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    const apiKey = ""; 

    function writeString(view, offset, string) {
      for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
    }

    function pcmToWav(pcmBase64, sampleRate = 24000) {
      const binaryString = atob(pcmBase64);
      const len = binaryString.length;
      const buffer = new ArrayBuffer(44 + len);
      const view = new DataView(buffer);
      
      writeString(view, 0, 'RIFF'); view.setUint32(4, 36 + len, true);
      writeString(view, 8, 'WAVE'); writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true); view.setUint16(20, 1, true);
      view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true);
      view.setUint16(34, 16, true); writeString(view, 36, 'data');
      view.setUint32(40, len, true);
      
      for (let i = 0; i < len; i++) view.setUint8(44 + i, binaryString.charCodeAt(i));
      const blob = new Blob([buffer], { type: 'audio/wav' });
      return URL.createObjectURL(blob);
    }

    const familyDictionary = {
      "Short A (صوت أَ القصير)": {
        at: [{ word: 'Bat', meaning: 'مضرب / خفاش', sound: 'بَاتْ' }, { word: 'Cat', meaning: 'قطة', sound: 'كَاتْ' }, { word: 'Hat', meaning: 'قبعة', sound: 'هَاتْ' }, { word: 'Mat', meaning: 'سجادة', sound: 'مَاتْ' }],
        an: [{ word: 'Man', meaning: 'رجل', sound: 'مَانْ' }, { word: 'Can', meaning: 'علبة', sound: 'كَانْ' }, { word: 'Fan', meaning: 'مروحة', sound: 'فَانْ' }]
      },
      "Short E (صوت إِ السريع)": {
        et: [{ word: 'Pet', meaning: 'أليف', sound: 'بِتْ' }, { word: 'Net', meaning: 'شبكة', sound: 'نِتْ' }],
        en: [{ word: 'Pen', meaning: 'قلم', sound: 'بِنْ' }, { word: 'Ten', meaning: 'عشرة', sound: 'تِنْ' }]
      }
    };

    const specialPatternsData = [
      { pattern: "ph", sound: "فْ (F)", explanation: "اندماج حرفي P و H لينطقا كحرف الفاء العربي تماماً.", examples: [{ word: "Phone", meaning: "هاتف", sound: "فُونْ" }, { word: "Photo", meaning: "صورة", sound: "فُوتُو" }] },
      { pattern: "-ice", sound: "آيْسْ", explanation: "ينطق حرف C كـ (S) إذا جاء بعده حرف e.", examples: [{ word: "Ice", meaning: "ثلج", sound: "آيْسْ" }, { word: "Rice", meaning: "أرز", sound: "رَايْسْ" }] }
    ];

    const wordFactoryLevels = [
      { word: 'Ice', prefix: 'I', family: 'ce', meaning: 'ثلج', options: ['I', 'A', 'O'] },
      { word: 'Rice', prefix: 'R', family: 'ice', meaning: 'أرز', options: ['R', 'P', 'N'] }
    ];

    const Icons = {
      home: <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
      volume: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>,
      loader: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
      puzzle: <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M11.5 5a2.5 2.5 0 0 1 5 0V7h1.5A2.5 2.5 0 0 1 20.5 9.5V11h-2a2.5 2.5 0 0 0 0 5h2v1.5a2.5 2.5 0 0 1-2.5 2.5H16.5v-2a2.5 2.5 0 0 0-5 0v2H10A2.5 2.5 0 0 1 7.5 18V16.5h2a2.5 2.5 0 0 0 0-5h-2V9.5A2.5 2.5 0 0 1 10 7h1.5V5z"/></svg>,
      book: <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
      sparkles: <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
    };

    function App() {
      const [currentScreen, setCurrentScreen] = useState('menu');

      const playAudioIntelligent = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          utterance.rate = 0.85;
          window.speechSynthesis.speak(utterance);
        }
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 pb-12">
          <header className="bg-indigo-950 text-white p-5 shadow-lg flex justify-between items-center">
            <div>
              <h1 className="text-xl font-black text-yellow-400">أكاديمية الكلمات الذكية 🎓</h1>
              <p className="text-xs text-indigo-200">تطوير مخصص لـ ماجد</p>
            </div>
            {currentScreen !== 'menu' && (
              <button onClick={() => setCurrentScreen('menu')} className="bg-yellow-500 hover:bg-yellow-600 text-indigo-950 px-4 py-2 rounded-full font-black flex items-center gap-1 transition-transform active:scale-95">
                {Icons.home} الرئيسية
              </button>
            )}
          </header>

          <main className="p-4 max-w-6xl mx-auto mt-6">
            {currentScreen === 'menu' && <MainMenu onNavigate={setCurrentScreen} />}
            {currentScreen === 'factory' && <WordFactory playTTS={playAudioIntelligent} />}
            {currentScreen === 'dict' && <BasicDictionary playTTS={playAudioIntelligent} />}
            {currentScreen === 'patterns' && <SpecialPatterns playTTS={playAudioIntelligent} />}
          </main>
        </div>
      );
    }

    function MainMenu({ onNavigate }) {
      return (
        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mt-8">
          <div onClick={() => onNavigate('factory')} className="bg-white rounded-3xl shadow-xl p-6 flex flex-col items-center justify-center cursor-pointer hover:-translate-y-2 border-b-4 border-blue-500 transition-all">
            <div className="p-4 rounded-full bg-blue-50 text-blue-600 mb-4">{Icons.puzzle}</div>
            <h2 className="text-2xl font-bold mb-2">مصنع الكلمات</h2>
            <p className="text-slate-500">ركب الحروف مع العائلات الكبرى</p>
          </div>
          <div onClick={() => onNavigate('dict')} className="bg-white rounded-3xl shadow-xl p-6 flex flex-col items-center justify-center cursor-pointer hover:-translate-y-2 border-b-4 border-purple-500 transition-all">
            <div className="p-4 rounded-full bg-purple-50 text-purple-600 mb-4">{Icons.book}</div>
            <h2 className="text-2xl font-bold mb-2">الموسوعة الكبرى</h2>
            <p className="text-slate-500">جميع عائلات الحروف الصوتية</p>
          </div>
          <div onClick={() => onNavigate('patterns')} className="bg-white rounded-3xl shadow-xl p-6 flex flex-col items-center justify-center cursor-pointer hover:-translate-y-2 border-b-4 border-orange-500 transition-all">
            <div className="p-4 rounded-full bg-orange-50 text-orange-600 mb-4">{Icons.sparkles}</div>
            <h2 className="text-2xl font-bold mb-2">المقاطع والتشكيلات</h2>
            <p className="text-slate-500">قواعد نطق المقاطع المركبة</p>
          </div>
        </div>
      );
    }

    function WordFactory({ playTTS }) {
      const [levelIndex, setLevelIndex] = useState(0);
      const [feedback, setFeedback] = useState(null);
      const level = wordFactoryLevels[levelIndex];

      const handleChoice = (letter) => {
        if (letter === level.prefix) {
          setFeedback('success'); playTTS(level.word);
          setTimeout(() => {
            if (levelIndex + 1 < wordFactoryLevels.length) { setLevelIndex(levelIndex + 1); setFeedback(null); }
            else { alert("كفو! أنهيت جميع الكلمات المتاحة بمصنع الكلمات!"); setLevelIndex(0); setFeedback(null); }
          }, 2000);
        } else { setFeedback('error'); setTimeout(() => setFeedback(null), 1000); }
      };

      return (
        <div className="bg-white rounded-3xl shadow-xl p-8 max-w-2xl mx-auto text-center border border-slate-100 animate-fadeIn">
          <h2 className="text-3xl font-black mb-8 text-blue-600">🧩 مصنع الكلمات</h2>
          <div className="mb-6 bg-blue-500 text-white p-4 rounded-2xl inline-block text-2xl font-black px-8">{level.meaning}</div>
          <div className="flex justify-center items-center gap-4 mb-12 text-5xl font-black" dir="ltr">
            <div className={`w-24 h-24 border-4 border-dashed rounded-2xl flex items-center justify-center ${feedback === 'success' ? 'border-green-500 text-green-600 bg-green-50' : 'border-slate-300 text-slate-400'}`}>
              {feedback === 'success' ? level.prefix : '?'}
            </div>
            <div>{level.family}</div>
          </div>
          <div className="flex justify-center gap-4" dir="ltr">
            {level.options.map((l, i) => (
              <button key={i} onClick={() => handleChoice(l)} className="w-20 h-20 bg-slate-800 text-white rounded-2xl text-2xl font-black shadow-[0_5px_0_#0f172a] active:translate-y-1 transition-all">{l}</button>
            ))}
          </div>
        </div>
      );
    }

    function BasicDictionary({ playTTS }) {
      return (
        <div className="space-y-8 animate-fadeIn">
          {Object.entries(familyDictionary).map(([group, families]) => (
            <div key={group} className="bg-white rounded-2xl p-6 shadow-md">
              <h3 className="text-2xl font-black text-purple-800 border-b pb-2 mb-4">{group}</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {Object.entries(families).map(([fam, words]) => (
                  <div key={fam} className="bg-slate-50 p-4 rounded-xl">
                    <span className="bg-purple-100 text-purple-800 font-bold px-2 py-1 rounded text-sm">عائلة -{fam}</span>
                    <div className="mt-3 space-y-2">
                      {words.map((w, idx) => (
                        <div key={idx} className="bg-white p-3 rounded-lg flex justify-between items-center shadow-sm">
                          <span className="font-bold text-lg">{w.word} - {w.meaning}</span>
                          <button onClick={() => playTTS(w.word)} className="bg-purple-100 p-2 rounded-full text-purple-700">{Icons.volume}</button>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      );
    }

    function SpecialPatterns({ playTTS }) {
      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 animate-fadeIn">
          {specialPatternsData.map((p, i) => (
            <div key={i} className="bg-white p-6 rounded-3xl shadow-md border-t-4 border-orange-500">
              <div className="flex justify-between mb-4">
                <span className="text-3xl font-black text-orange-600 font-mono">{p.pattern}</span>
                <span className="bg-orange-100 text-orange-800 px-3 py-1 rounded-xl font-bold">{p.sound}</span>
              </div>
              <p className="text-slate-600 mb-4">{p.explanation}</p>
              {p.examples.map((ex, idx) => (
                <div key={idx} className="bg-slate-50 p-3 rounded-xl flex justify-between items-center mb-2">
                  <span className="font-bold">{ex.word} ({ex.meaning})</span>
                  <button onClick={() => playTTS(ex.word)} className="bg-orange-100 p-2 rounded-full text-orange-600">{Icons.volume}</button>
                </div>
              ))}
            </div>
          ))}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
