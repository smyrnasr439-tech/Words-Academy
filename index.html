<!DOCTYPE html>

  <title>أكاديمية الكلمات الذكية</title>
  
  <!-- استدعاء ملف الـ manifest الخاص بك -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">

  <!-- المكتبات الأساسية -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');
    body {
      font-family: 'Tajawal', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      background-color: #f8fafc;
      overflow-x: hidden;
    }
    
    /* أنيميشن الدخول الناعم */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeUp { animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    /* أنيميشن الاهتزاز للخطأ */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
    }
    .animate-shake { animation: shake 0.4s ease-in-out; }

    /* أنيميشن النبض للنجاح */
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .animate-pop { animation: pop 0.3s ease-out; }

    /* تخصيص شريط التمرير */
    .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>

    const specialPatternsData = [

      { pattern: "sh", sound: "شْ (Sh)", explanation: "ينطقان كحرف الشين.", examples: [{ word: "Ship", meaning: "سفينة" }, { word: "Shop", meaning: "محل" }, { word: "Brush", meaning: "فرشاة" }] },
      { pattern: "ch", sound: "تْشْ (Ch)", explanation: "تشديد خفيف (تاء + شين).", examples: [{ word: "Chair", meaning: "كرسي" }, { word: "Cheese", meaning: "جبن" }, { word: "Beach", meaning: "شاطئ" }] },
      { pattern: "th", sound: "ذ / ث (Th)", explanation: "إما ثاء أو ذال.", examples: [{ word: "Three", meaning: "ثلاثة" }, { word: "This", meaning: "هذا" }, { word: "Brother", meaning: "أخ" }] },

      { word: 'Ice', prefix: 'I', family: 'ce', meaning: 'ثلج', options: ['I', 'A', 'O'] },

    // ==========================================
    // 2. الأيقونات (SVG)
    // ==========================================
    const Icons = {

    // ==========================================
    // 3. المكونات الرئيسية للتطبيق (الذاكرة والتنقل)
    // ==========================================
    function App() {
      // الذاكرة الداخلية LocalStorage لحفظ شاشتك وتقدمك
      const [currentScreen, setCurrentScreen] = useState(() => localStorage.getItem('ac_screen') || 'menu');
      const [phraseLvl, setPhraseLvl] = useState(() => Number(localStorage.getItem('ac_phrase_lvl')) || 0);
      const [factoryLvl, setFactoryLvl] = useState(() => Number(localStorage.getItem('ac_factory_lvl')) || 0);

      useEffect(() => { localStorage.setItem('ac_screen', currentScreen); }, [currentScreen]);
      useEffect(() => { localStorage.setItem('ac_phrase_lvl', phraseLvl); }, [phraseLvl]);
      useEffect(() => { localStorage.setItem('ac_factory_lvl', factoryLvl); }, [factoryLvl]);

      // دالة النطق الأساسية
      const playTTS = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          utterance.rate = 0.85;
          window.speechSynthesis.speak(utterance);
        }
      };

      return (
        <div className="min-h-screen pb-12">
          {/* تأثير الزجاج (Glassmorphism) على الشريط العلوي */}
          <header className="bg-indigo-600/90 backdrop-blur-md text-white p-4 shadow-lg flex justify-between items-center sticky top-0 z-50 border-b border-indigo-500/50">
            <div>
              <h1 className="text-xl md:text-2xl font-black text-white drop-shadow-md">أكاديمية الكلمات 🎓</h1>
            </div>
            {currentScreen !== 'menu' && (
              <button 
                onClick={() => setCurrentScreen('menu')} 
                className="bg-white text-indigo-700 px-5 py-2 rounded-full font-black flex items-center gap-2 text-sm shadow-[0_4px_0_rgba(0,0,0,0.2)] hover:-translate-y-1 active:translate-y-1 active:shadow-none transition-all"
              >
                {Icons.home} <span className="hidden sm:inline">الرئيسية</span>
              </button>
            )}
          </header>

          <main className="p-4 max-w-5xl mx-auto mt-6">
            {currentScreen === 'menu' && <MainMenu onNavigate={setCurrentScreen} />}
            {currentScreen === 'dict' && <MegaDictionary playTTS={playTTS} />}
            {currentScreen === 'patterns' && <SpecialPatterns playTTS={playTTS} />}
            {currentScreen === 'factory' && <WordFactory levelIndex={factoryLvl} setLevelIndex={setFactoryLvl} playTTS={playTTS} />}
            {currentScreen === 'phraseGame' && <PhraseBuilderGame levelIndex={phraseLvl} setLevelIndex={setPhraseLvl} playTTS={playTTS} />}
          </main>
        </div>
      );
    }

    // ==========================================
    // واجهة القوائم (أزرار 3D وتدرجات)
    // ==========================================
    function MainMenu({ onNavigate }) {
      return (
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-5 mt-2 animate-fadeUp">
          <MenuCard title="تحدي الجمل" desc="رتب الكلمات لبناء جمل إنجليزية صحيحة" icon={Icons.game} color="emerald" onClick={() => onNavigate('phraseGame')} />
          <MenuCard title="الموسوعة الشاملة" desc="أكثر من 1000 كلمة مصنفة للنطق" icon={Icons.book} color="purple" onClick={() => onNavigate('dict')} />
          <MenuCard title="مصنع الكلمات" desc="ركب الحروف لتبني عائلات الكلمات" icon={Icons.puzzle} color="blue" onClick={() => onNavigate('factory')} />
          <MenuCard title="المقاطع والمخارج" desc="تعلم قواعد نطق الحروف المركبة" icon={Icons.sparkles} color="orange" onClick={() => onNavigate('patterns')} />
        </div>
      );
    }

    function MenuCard({ title, desc, icon, color, onClick }) {
      const colors = {
        blue: "from-blue-400 to-blue-600 shadow-[0_6px_0_#1e3a8a]",
        purple: "from-purple-400 to-purple-600 shadow-[0_6px_0_#4c1d95]",
        orange: "from-orange-400 to-orange-500 shadow-[0_6px_0_#9a3412]",
        emerald: "from-emerald-400 to-emerald-600 shadow-[0_6px_0_#064e3b]"
      };
      return (
        <div 
          onClick={onClick} 
          className={`bg-gradient-to-br ${colors[color]} text-white rounded-3xl p-6 flex flex-col items-center justify-center cursor-pointer hover:-translate-y-2 active:translate-y-1 active:shadow-none transition-all duration-200`}
        >
          <div className="p-4 rounded-full mb-3 bg-white/20 backdrop-blur-sm border border-white/30">{icon}</div>
          <h2 className="font-black mb-1 text-2xl drop-shadow-md">{title}</h2>
          <p className="text-white/90 text-sm font-bold text-center">{desc}</p>
        </div>
      );
    }

    // ==========================================
    // تحدي الجمل (بتأثيرات تفاعلية)
    // ==========================================
    function PhraseBuilderGame({ levelIndex, setLevelIndex, playTTS }) {
      const [selected, setSelected] = useState([]);
      const [available, setAvailable] = useState([]);
      const [feedback, setFeedback] = useState(null);
      const currentLevel = phraseLevels[levelIndex];

      useEffect(() => {
        if (currentLevel) {
          setAvailable([...currentLevel.c].sort(() => Math.random() - 0.5));
          setSelected([]);
          setFeedback(null);
        }
      }, [levelIndex]);

      if (!currentLevel) {
        return (
          <div className="bg-white p-10 rounded-3xl text-center shadow-xl animate-fadeUp">
            <div className="text-6xl mb-4">🏆</div>
            <h2 className="text-3xl font-black text-emerald-600 mb-2">أنت أسطورة!</h2>
            <p className="text-slate-500 font-bold mb-6">لقد أنهيت جميع مستويات تحدي الجمل بنجاح!</p>
            <button onClick={() => setLevelIndex(0)} className="bg-emerald-600 text-white px-8 py-3 rounded-full font-black shadow-[0_4px_0_#065f46] hover:-translate-y-1 active:translate-y-1 active:shadow-none transition-all">إعادة اللعب</button>
          </div>
        );
      }

      return (
        <div className={`bg-white rounded-3xl shadow-lg p-6 md:p-8 border-2 ${feedback === 'error' ? 'border-red-400 animate-shake' : 'border-slate-100'} animate-fadeUp`}>
          <div className="flex justify-between items-center mb-6">
            <h2 className="text-xl font-black text-emerald-600 flex items-center gap-2"><span>🎮</span> تحدي الجمل</h2>
            <span className="bg-emerald-100 text-emerald-800 px-4 py-1.5 rounded-full font-bold text-sm shadow-inner">مستوى {levelIndex + 1}</span>
          </div>
          
          <div className="bg-slate-50 p-5 rounded-2xl mb-6 flex items-center justify-between border-2 border-slate-100 shadow-sm">
            <p className="text-lg font-black text-slate-700">ترجم: <span className="text-emerald-600 ml-2">{currentLevel.m}</span></p>
          </div>
          
          <div className={`min-h-[80px] p-4 border-2 border-dashed rounded-2xl flex flex-wrap gap-2 items-center mb-6 ${feedback === 'success' ? 'border-emerald-500 bg-emerald-50 animate-pop' : 'border-slate-300 bg-slate-50'}`} dir="ltr">
            {selected.map((w, i) => (
              <button key={i} onClick={() => { setAvailable([...available, w]); setSelected(selected.filter((_, idx) => idx !== i)); }} className="bg-indigo-500 text-white font-bold px-4 py-2 rounded-xl text-base shadow-[0_4px_0_#312e81] active:translate-y-1 active:shadow-none transition-all">{w}</button>
            ))}
          </div>
          
          <div className="flex flex-wrap gap-3 justify-center mb-8" dir="ltr">
            {available.map((w, i) => (
              <button key={i} onClick={() => { setSelected([...selected, w]); setAvailable(available.filter((_, idx) => idx !== i)); }} className="bg-white border-2 border-slate-200 text-slate-700 font-bold px-4 py-2.5 rounded-xl text-base hover:bg-slate-50 shadow-[0_4px_0_#cbd5e1] active:translate-y-1 active:shadow-none transition-all">{w}</button>
            ))}
          </div>
          
          <div className="flex justify-center gap-3">
            {selected.length > 0 && <button onClick={() => { setAvailable([...currentLevel.c].sort(() => Math.random() - 0.5)); setSelected([]); setFeedback(null); }} className="bg-slate-100 text-slate-600 font-bold px-6 py-3 rounded-2xl flex items-center gap-2 hover:bg-slate-200 transition-colors shadow-sm">{Icons.reset} مسح</button>}
            {available.length === 0 && <button onClick={() => {
              if (JSON.stringify(selected) === JSON.stringify(currentLevel.c)) {
                setFeedback('success'); playTTS(currentLevel.c.join(" "));
                setTimeout(() => setLevelIndex(levelIndex + 1), 1600);
              } else { setFeedback('error'); setTimeout(() => setFeedback(null), 800); }
            }} className="bg-emerald-500 text-white font-black text-lg px-10 py-3 rounded-2xl shadow-[0_4px_0_#065f46] hover:-translate-y-1 active:translate-y-1 active:shadow-none transition-all">تحقق</button>}
          </div>
        </div>
      );
    }

    // ==========================================
    // مصنع الكلمات والقواميس (تم تحسين الاستايل)
    // ==========================================
    function WordFactory({ levelIndex, setLevelIndex, playTTS }) {
      const [feedback, setFeedback] = useState(null);
      const level = wordFactoryLevels[levelIndex];

      if (!level) {
        return (
          <div className="bg-white p-10 rounded-3xl text-center shadow-xl animate-fadeUp">
            <div className="text-6xl mb-4">🌟</div>
            <h2 className="text-2xl font-black text-blue-600 mb-2">ممتاز جداً!</h2>
            <p className="text-slate-500 font-bold mb-6">أكملت جميع عائلات الكلمات المتاحة.</p>
            <button onClick={() => setLevelIndex(0)} className="bg-blue-600 text-white px-8 py-3 rounded-full font-black shadow-[0_4px_0_#1e3a8a] hover:-translate-y-1 active:translate-y-1 active:shadow-none transition-all">إعادة البدء</button>
          </div>
        );
      }

      return (
        <div className={`bg-white rounded-3xl shadow-lg p-8 border-2 ${feedback === 'error' ? 'border-red-400 animate-shake' : 'border-slate-100'} text-center animate-fadeUp max-w-lg mx-auto`}>
          <h2 className="text-2xl font-black mb-6 text-blue-600 flex items-center justify-center gap-2">🧩 مصنع الكلمات</h2>
          <div className="mb-6 bg-blue-50 text-blue-900 border border-blue-200 p-3 rounded-2xl inline-block text-xl font-black px-8 shadow-inner">{level.meaning}</div>
          <div className="flex justify-center items-center gap-4 mb-10 text-4xl font-black" dir="ltr">
            <div className={`w-20 h-20 border-4 border-dashed rounded-2xl flex items-center justify-center transition-colors ${feedback === 'success' ? 'border-green-500 text-green-600 bg-green-50 animate-pop' : feedback === 'error' ? 'border-red-400 text-red-500 bg-red-50' : 'border-slate-300 text-slate-300'}`}>
              {feedback === 'success' ? level.prefix : '?'}
            </div>
            <div className="text-slate-800 tracking-wide">{level.family}</div>
          </div>
          <div className="flex justify-center gap-4" dir="ltr">
            {level.options.map((l, i) => (
              <button key={i} onClick={() => {
                if (l === level.prefix) {
                  setFeedback('success'); playTTS(level.word);
                  setTimeout(() => { setLevelIndex(levelIndex + 1); setFeedback(null); }, 1500);
                } else { setFeedback('error'); setTimeout(() => setFeedback(null), 800); }
              }} className="w-16 h-16 bg-slate-800 text-white rounded-2xl text-2xl font-black shadow-[0_6px_0_#0f172a] hover:-translate-y-1 active:translate-y-1 active:shadow-none transition-all">{l}</button>
            ))}
          </div>
        </div>
      );
    }

    function MegaDictionary({ playTTS }) {
      const categories = [...new Set(megaDictionary.map(item => item.c))];
      const [activeCat, setActiveCat] = useState(categories[0]);

      return (
        <div className="animate-fadeUp">
          <div className="flex gap-2 overflow-x-auto pb-4 mb-4 custom-scrollbar" dir="rtl">
            {categories.map((cat, idx) => (
              <button key={idx} onClick={() => setActiveCat(cat)} className={`px-5 py-2.5 rounded-full font-bold text-sm whitespace-nowrap transition-all shadow-sm ${activeCat === cat ? 'bg-purple-600 text-white shadow-purple-200' : 'bg-white text-purple-700 border border-purple-100 hover:bg-purple-50'}`}>
                {cat}
              </button>
            ))}
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            {megaDictionary.filter(item => item.c === activeCat).map((group, idx) => (
              <div key={idx} className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-shadow">
                <div className="bg-purple-50 text-purple-900 py-3 px-5 font-black text-lg text-center border-b border-purple-100" dir="ltr">{group.f}</div>
                <div className="p-3 space-y-2 max-h-[280px] overflow-y-auto custom-scrollbar">
                  {group.data.map((w, i) => (
                    <div key={i} className="flex justify-between items-center bg-slate-50 border border-slate-100 p-3 rounded-2xl hover:border-purple-200 transition-colors">
                      <div className="text-right">
                        <span className="font-black text-lg block text-slate-800" dir="ltr">{w.w}</span>
                        <span className="text-sm text-slate-500 font-bold">{w.m} <span className="text-slate-400 font-normal text-xs">({w.s})</span></span>
                      </div>
                      <button onClick={() => playTTS(w.w)} className="bg-white p-2.5 rounded-full text-purple-600 shadow-[0_3px_0_#cbd5e1] hover:-translate-y-0.5 active:translate-y-1 active:shadow-none transition-all">{Icons.volume}</button>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function SpecialPatterns({ playTTS }) {
      return (
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-5 animate-fadeUp">
          {specialPatternsData.map((p, i) => (
            <div key={i} className="bg-white p-6 rounded-3xl shadow-sm border-t-4 border-orange-500 flex flex-col justify-between border border-slate-100">
              <div>
                <div className="flex justify-between items-center mb-3">
                  <span className="text-3xl font-black text-orange-600 font-mono" dir="ltr">-{p.pattern}</span>
                  <span className="bg-orange-50 text-orange-800 px-4 py-1.5 rounded-full font-bold text-sm border border-orange-100">{p.sound}</span>
                </div>
                <p className="text-slate-600 mb-5 text-sm font-bold leading-relaxed">{p.explanation}</p>
              </div>
              <div className="space-y-2 border-t border-slate-100 pt-4">
                {p.examples.map((ex, idx) => (
                  <div key={idx} className="bg-slate-50 border border-slate-100 p-3 rounded-2xl flex justify-between items-center">
                    <div>
                      <span className="font-black text-base block text-slate-800" dir="ltr">{ex.word}</span>
                      <span className="text-xs text-slate-500 font-bold">{ex.meaning}</span>
                    </div>
                    <button onClick={() => playTTS(ex.word)} className="bg-white p-2.5 rounded-full text-orange-600 shadow-[0_3px_0_#cbd5e1] hover:-translate-y-0.5 active:translate-y-1 active:shadow-none transition-all">{Icons.volume}</button>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
