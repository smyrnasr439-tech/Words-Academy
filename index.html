<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Words Academy</title>
    <!-- تضمين المكتبات الأساسية لعمل التطبيق بدون إنترنت بعد تحميله أول مرة -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        body {
            font-family: 'Tajawal', sans-serif;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- الحاوية التي سيعمل بداخلها التطبيق -->
    <div id="root"></div>

    <!-- كود الـ React (بابل المدمج) -->
    <script type="text/text/babel">
        const { useState, useEffect } = React;

        // مفتاح الذكاء الاصطناعي للصوت
        const apiKey = "";

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        function pcmToWav(pcmBase64, sampleRate = 24000) {
            const binaryString = atob(pcmBase64);
            const len = binaryString.length;
            const buffer = new ArrayBuffer(44 + len);
            const view = new DataView(buffer);

            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + len, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, len, true);

            for (let i = 0; i < len; i++) {
                view.setUint8(44 + i, binaryString.charCodeAt(i));
            }
            const blob = new Blob([buffer], { type: 'audio/wav' });
            return URL.createObjectURL(blob);
        }

        // --- قاعدة البيانات الكبرى (الموسوعة الشاملة) ---
        const familyDictionary = {
            "Short A (صوت أ القصير)": {
                at: [
                    { word: 'Bat', meaning: 'مضرب / خفاش', sound: 'بَاتْ' },
                    { word: 'Cat', meaning: 'قطة', sound: 'كَاتْ' },
                    { word: 'Mat', meaning: 'سجادة صغيرة', sound: 'مَاتْ' }
                ],
                an: [
                    { word: 'Man', meaning: 'رجل', sound: 'مَانْ' },
                    { word: 'Can', meaning: 'يستطيع / علبة', sound: 'كَانْ' },
                    { word: 'Van', meaning: 'شاحنة صغيرة', sound: 'فَانْ' }
                ],
                ad: [
                    { word: 'Sad', meaning: 'حزين', sound: 'سَادْ' },
                    { word: 'Dad', meaning: 'أب', sound: 'دَادْ' },
                    { word: 'Bad', meaning: 'سيء', sound: 'بَادْ' }
                ],
                ag: [
                    { word: 'Bag', meaning: 'حقيبة', sound: 'بَاغْ' },
                    { word: 'Tag', meaning: 'بطاقة', sound: 'تَاغْ' }
                ]
            },
            "Short E (صوت إ الكسرة الخفيفة)": {
                et: [
                    { word: 'Pet', meaning: 'حيوان أليف', sound: 'بِتْ' },
                    { word: 'Net', meaning: 'شبكة', sound: 'نِتْ' },
                    { word: 'Wet', meaning: 'مبلل', sound: 'وِتْ' }
                ],
                en: [
                    { word: 'Pen', meaning: 'قلم', sound: 'بِنْ' },
                    { word: 'Ten', meaning: 'عشرة', sound: 'تِنْ' },
                    { word: 'Hen', meaning: 'دجاجة', sound: 'هِنْ' }
                ]
            },
            "Short I (الكسرة القوية)": {
                in: [
                    { word: 'Win', meaning: 'يفوز', sound: 'وِنْ' },
                    { word: 'Pin', meaning: 'دبوس', sound: 'بِنْ' }
                ],
                it: [
                    { word: 'Sit', meaning: 'يجلس', sound: 'سِتْ' },
                    { word: 'Hit', meaning: 'يضرب', sound: 'هِتْ' }
                ],
                ice: [
                    { word: 'Ice', meaning: 'ثلج', sound: 'أَايْسْ' },
                    { word: 'Rice', meaning: 'أرز', sound: 'رَايْسْ' },
                    { word: 'Nice', meaning: 'لطيف', sound: 'نَايْسْ' }
                ],
                ight: [
                    { word: 'Night', meaning: 'الليل', sound: 'نَايْتْ' },
                    { word: 'Light', meaning: 'ضوء', sound: 'لَايْتْ' }
                ]
            },
            "Short O (صوت أو المفتوح)": {
                ot: [
                    { word: 'Hot', meaning: 'حار', sound: 'هَاتْ' },
                    { word: 'Pot', meaning: 'وعاء', sound: 'بَاتْ' }
                ],
                op: [
                    { word: 'Hop', meaning: 'يقفز', sound: 'هَابْ' },
                    { word: 'Top', meaning: 'القمة', sound: 'تَابْ' }
                ]
            },
            "Short U (صوت أ المفخم)": {
                ug: [
                    { word: 'Bug', meaning: 'حشرة', sound: 'بَاغْ' },
                    { word: 'Mug', meaning: 'كوب', sound: 'مَاغْ' }
                ],
                un: [
                    { word: 'Sun', meaning: 'شمس', sound: 'سَانْ' },
                    { word: 'Fun', meaning: 'مرح', sound: 'فَانْ' }
                ]
            }
        };

        const specialPatternsData = [
            { pattern: "ph", sound: "F (صوت حرف ف)", explanation: "ينطق كحرف الفاء العربي تماماً H و P عندما تجتمع حرفي", examples: [{ word: "Photo", meaning: "صورة", sound: "فوتو" }, { word: "Phone", meaning: "هاتف", sound: "فون" }] },
            { pattern: "-ice", sound: "Ays (صوت آيس)", explanation: "ينطق كـ س إذا جاء بعده حرف (C) لأن الـ ، E طويل وممدود لـ ل وجود الـ", examples: [{ word: "Ice", meaning: "ثلج", sound: "آيس" }, { word: "Rice", meaning: "أرز", sound: "رايس" }] },
            { pattern: "-tion", sound: "Sh-un (شن)", explanation: "مقطع شهير جداً ينطق شن ويقوم بتحويل الأفعال لأسماء", examples: [{ word: "Action", meaning: "حدث / حركة", sound: "أكشن" }, { word: "Station", meaning: "محطة", sound: "ستيشن" }] },
            { pattern: "-ing", sound: "Ing (إنق)", explanation: "تضاف في نهاية الفعل للدلالة على الاستمرارية الفورية", examples: [{ word: "Playing", meaning: "يلعب الآن", sound: "بلينق" }, { word: "Reading", meaning: "يقرأ الآن", sound: "ريدينق" }] }
        ];

        // --- كائن الأيقونات النظيفة (مجهز للعمل أوفلاين بالكامل) ---
        const AppIcons = {
            // كود قطعة البازل الحادة والواضحة هندسياً لشاشات الجوال
            puzzle: (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" class="inline-block">
                    <path d="M11.5 5a2.5 2.5 0 0 1 5 0V7h1.5A2.5 2.5 0 0 1 20.5 9.5V11h-2a2.5 2.5 0 0 0 0 5h2v1.5a2.5 2.5 0 0 1-2.5 2.5H16.5v-2a2.5 2.5 0 0 0-5 0v2H10A2.5 2.5 0 0 1 7.5 18V16.5h2a2.5 2.5 0 0 0 0-5h-2V9.5A2.5 2.5 0 0 1 10 7h1.5V5z"/>
                </svg>
            ),
            book: (
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class="inline-block">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                </svg>
            ),
            volume: (
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class="inline-block">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
                </svg>
            )
        };

        // --- المكون الرئيسي للتطبيق ---
        function App() {
            const [activeTab, setActiveTab] = useState('families');

            return (
                <div class="min-h-screen bg-slate-50 pb-12">
                    {/* الهيدر العلوي */}
                    <header class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white py-8 px-4 shadow-lg text-center">
                        <h1 class="text-3xl font-black mb-2 tracking-wide">أكاديمية الكلمات المتقدمة 🎓</h1>
                        <p class="text-blue-100 text-sm">أتقن النطق الإنجليزي والقواعد الصوتية بسهولة</p>
                    </header>

                    {/* أزرار التنقل الرئيسية */}
                    <div class="max-w-md mx-auto mt-6 px-4 flex gap-4">
                        <button 
                            onClick={() => setActiveTab('families')}
                            class={`flex-1 py-3 px-4 rounded-xl font-bold text-sm transition-all duration-200 flex items-center justify-center gap-2 shadow-sm ${activeTab === 'families' ? 'bg-blue-600 text-white scale-105' : 'bg-white text-slate-600 hover:bg-slate-100'}`}
                        >
                            {AppIcons.book} عائلات الكلمات
                        </button>
                        <button 
                            onClick={() => setActiveTab('patterns')}
                            class={`flex-1 py-3 px-4 rounded-xl font-bold text-sm transition-all duration-200 flex items-center justify-center gap-2 shadow-sm ${activeTab === 'patterns' ? 'bg-blue-600 text-white scale-105' : 'bg-white text-slate-600 hover:bg-slate-100'}`}
                        >
                            {AppIcons.puzzle} الأنماط الخاصة
                        </button>
                    </div>

                    {/* محتوى التبويب الأول: عائلات الكلمات */}
                    <main class="max-w-4xl mx-auto mt-8 px-4">
                        {activeTab === 'families' && (
                            <div class="space-y-8 animate-fadeIn">
                                {Object.entries(familyDictionary).map(([familyName, subFamilies]) => (
                                    <div key={familyName} class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                                        <h2 class="text-xl font-black text-slate-800 border-b-2 border-blue-500 pb-2 mb-4 flex items-center gap-2">
                                            <span class="w-2 h-6 bg-blue-600 rounded-full"></span> {familyName}
                                        </h2>
                                        
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            {Object.entries(subFamilies).map(([subName, words]) => (
                                                <div key={subName} class="bg-slate-50 p-4 rounded-xl border border-slate-200/60">
                                                    <span class="inline-block bg-indigo-100 text-indigo-700 font-bold px-3 py-1 rounded-lg text-xs mb-3">
                                                        عائلة الـ ({subName}-)
                                                    </span>
                                                    <div class="space-y-2">
                                                        {words.map((item, index) => (
                                                            <div key={index} class="bg-white p-3 rounded-lg flex justify-between items-center shadow-xs hover:border-blue-300 border border-transparent transition-colors">
                                                                <div>
                                                                    <p class="text-lg font-bold text-slate-900 tracking-wide">{item.word}</p>
                                                                    <p class="text-xs text-slate-500">{item.meaning}</p>
                                                                </div>
                                                                <button class="bg-slate-100 hover:bg-blue-50 text-slate-600 hover:text-blue-600 p-2 rounded-lg transition-colors flex items-center justify-center">
                                                                    {AppIcons.volume}
                                                                </button>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* محتوى التبويب الثاني: الأنماط الخاصة */}
                        {activeTab === 'patterns' && (
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 animate-fadeIn">
                                {specialPatternsData.map((item, index) => (
                                    <div key={index} class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow">
                                        <div class="flex justify-between items-start mb-3">
                                            <span class="text-2xl font-black text-blue-600 font-mono bg-blue-50 px-3 py-1 rounded-xl">
                                                {item.pattern}
                                            </span>
                                            <span class="text-xs bg-emerald-100 text-emerald-800 font-bold px-2.5 py-1 rounded-full">
                                                {item.sound}
                                            </span>
                                        </div>
                                        <p class="text-sm text-slate-600 mb-4 leading-relaxed">{item.explanation}</p>
                                        
                                        <div class="border-t border-slate-100 pt-3 space-y-2">
                                            <p class="text-xs font-bold text-slate-400 mb-1">أمثلة تطبيقية:</p>
                                            {item.examples.map((ex, idx) => (
                                                <div key={idx} class="flex justify-between items-center bg-slate-50 p-2.5 rounded-lg text-sm">
                                                    <div>
                                                        <span class="font-bold text-slate-800">{ex.word}</span>
                                                        <span class="text-xs text-slate-400 mx-2">|</span>
                                                        <span class="text-slate-500 text-xs">{ex.meaning}</span>
                                                    </div>
                                                    <span class="text-xs text-indigo-600 font-medium bg-indigo-50 px-2 py-0.5 rounded">
                                                        النطق: {ex.sound}
                                                    </span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        // رندر التطبيق في شاشة العرض
        const root = Scrooge = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
