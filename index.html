          utterance.lang = 'en-US';
          utterance.rate = 0.85; // سرعة مناسبة للتعليم
          utterance.pitch = 1;
          window.speechSynthesis.speak(utterance);

        }

            {currentScreen === 'factory' && <WordFactory playTTS={playTTS} />}
            {currentScreen === 'dict' && <MegaDictionary playTTS={playTTS} />}
            {currentScreen === 'patterns' && <SpecialPatterns playTTS={playTTS} />}
            {currentScreen === 'phraseGame' && <PhraseBuilderGame playTTS={playTTS} />}
          </main>
        </div>
      );
    }

    function MainMenu({ onNavigate }) {
      return (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mt-4">
          <MenuCard title="تحدي الجمل" desc="50 مستوى لترتيب الكلمات" icon={Icons.game} color="emerald" onClick={() => onNavigate('phraseGame')} />
          <MenuCard title="الموسوعة الشاملة" desc="أكثر من 1000 كلمة مصنفة" icon={Icons.book} color="purple" onClick={() => onNavigate('dict')} />
          <MenuCard title="المقاطع الصوتية" desc="قواعد النطق المتقدمة" icon={Icons.sparkles} color="orange" onClick={() => onNavigate('patterns')} />
          <MenuCard title="مصنع الكلمات" desc="ركب الحروف وبناء العائلات" icon={Icons.puzzle} color="blue" onClick={() => onNavigate('factory')} />
        </div>
      );
    }

    function MenuCard({ title, desc, icon, color, onClick }) {
      const colors = {
        blue: "text-blue-600 bg-blue-50 border-blue-500 hover:shadow-blue-200",
        purple: "text-purple-600 bg-purple-50 border-purple-500 hover:shadow-purple-200",
        orange: "text-orange-600 bg-orange-50 border-orange-500 hover:shadow-orange-200",
        emerald: "text-emerald-600 bg-emerald-50 border-emerald-500 hover:shadow-emerald-200"
      };
      return (
        <div onClick={onClick} className={`bg-white rounded-3xl shadow-lg p-8 flex flex-col items-center justify-center cursor-pointer hover:-translate-y-2 border-b-4 transition-all duration-300 ${colors[color]}`}>
          <div className="p-5 rounded-full mb-4 bg-white shadow-sm border border-slate-100">{icon}</div>
          <h2 className="text-2xl font-black mb-2 text-slate-800">{title}</h2>
          <p className="text-slate-500 text-sm text-center font-bold">{desc}</p>
        </div>
      );
    }

    // ==========================================
    // 3. الموسوعة الشاملة (بأقسام ذكية)
    // ==========================================
    function MegaDictionary({ playTTS }) {
      // استخراج الأقسام الرئيسية فقط
      const categories = [...new Set(megaDictionary.map(item => item.c))];
      const [activeCat, setActiveCat] = useState(categories[0]);

      return (
        <div className="animate-fadeIn">
          <h2 className="text-3xl font-black text-center mb-6 text-purple-700">📖 القاموس الشامل</h2>
          
          {/* أزرار الأقسام لتنظيم الـ 1000 كلمة */}
          <div className="flex flex-wrap gap-2 justify-center mb-8">
            {categories.map((cat, idx) => (
              <button 
                key={idx} 
                onClick={() => setActiveCat(cat)}
                className={`px-5 py-2.5 rounded-full font-bold text-sm transition-all ${activeCat === cat ? 'bg-purple-600 text-white shadow-md' : 'bg-white text-purple-600 border border-purple-200 hover:bg-purple-50'}`}
              >
                {cat}
              </button>
            ))}
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {megaDictionary.filter(item => item.c === activeCat).map((group, idx) => (
              <div key={idx} className="bg-white rounded-3xl shadow-md border border-slate-100 overflow-hidden">
                <div className="bg-purple-100 text-purple-900 py-3 px-5 font-black text-xl text-center border-b border-purple-200" dir="ltr">
                  {group.f}
                </div>
                <div className="p-4 max-h-[300px] overflow-y-auto custom-scrollbar space-y-2">
                  {group.data.map((w, i) => (
                    <div key={i} className="flex justify-between items-center bg-slate-50 p-3 rounded-xl hover:bg-slate-100 transition-colors">
                      <div className="text-right">
                        <span className="font-black text-lg block text-slate-800">{w.w}</span>
                        <span className="text-xs text-slate-500 font-bold">{w.m}</span>
                      </div>
                      <button 
                        onClick={() => playTTS(w.w)} 
                        className="bg-white p-2.5 rounded-full text-purple-600 shadow-sm border border-slate-200 hover:bg-purple-600 hover:text-white transition-colors active:scale-90"
                      >
                        {Icons.volume}
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ==========================================
    // 4. تحدي الجمل (50 مستوى مع زر الصوت والريست)
    // ==========================================
    function PhraseBuilderGame({ playTTS }) {
      const [lvl, setLvl] = useState(0);
      const [selected, setSelected] = useState([]);
      const [available, setAvailable] = useState([]);
      const [feedback, setFeedback] = useState(null);

      const currentLevel = phraseLevels[lvl];

      // خلط الكلمات عند بدء المستوى
      useEffect(() => {
        if (currentLevel) {
          const shuffled = [...currentLevel.c].sort(() => Math.random() - 0.5);
          setAvailable(shuffled);
          setSelected([]);
          setFeedback(null);
        }
      }, [lvl]);

      const selectWord = (word, idx) => {
        setSelected([...selected, word]);
        setAvailable(available.filter((_, i) => i !== idx));
      };

      const removeWord = (word, idx) => {
        setAvailable([...available, word]);
        setSelected(selected.filter((_, i) => i !== idx));
      };

      const resetLevel = () => {
        const shuffled = [...currentLevel.c].sort(() => Math.random() - 0.5);
        setAvailable(shuffled);
        setSelected([]);
        setFeedback(null);
      };

      const checkSentence = () => {
        const isCorrect = JSON.stringify(selected) === JSON.stringify(currentLevel.c);
        if (isCorrect) {
          setFeedback('success');
          playTTS(currentLevel.c.join(" "));
          setTimeout(() => {
            if (lvl + 1 < phraseLevels.length) setLvl(lvl + 1);
            else { alert("مبروك يا ماجد! ختمت كل مستويات الجمل الـ 50!"); setLvl(0); }
          }, 2000);
        } else {
          setFeedback('error');
          setTimeout(() => setFeedback(null), 1000);
        }
      };

      if (!currentLevel) return null;

      return (
        <div className="bg-white rounded-3xl shadow-xl p-6 md:p-10 max-w-3xl mx-auto animate-fadeIn border border-slate-100">
          <div className="flex justify-between items-center mb-6">
            <h2 className="text-2xl font-black text-emerald-600 flex items-center gap-2">
              <span>🎮</span> تحدي الجمل
            </h2>
            <span className="bg-emerald-100 text-emerald-800 px-4 py-1.5 rounded-full font-bold text-sm">
              مستوى {lvl + 1} من {phraseLevels.length}
            </span>
          </div>
          
          <div className="bg-emerald-50 border border-emerald-100 p-5 rounded-2xl mb-8 flex items-center justify-between shadow-inner">
            <p className="text-lg font-black text-emerald-900">
              ترجم: <span className="text-emerald-700">{currentLevel.m}</span>
            </p>
            <button 
              onClick={() => playTTS(currentLevel.c.join(" "))} 
              className="bg-emerald-500 text-white p-3 rounded-full hover:bg-emerald-600 transition-all shadow-md active:scale-90 flex-shrink-0"
              title="استمع للحل الصحيح"
            >
              {Icons.volume}
            </button>
          </div>
          
          <div className={`min-h-[100px] p-5 border-4 border-dashed rounded-2xl flex flex-wrap gap-2 items-center mb-6 transition-colors ${feedback === 'success' ? 'border-green-500 bg-green-50' : feedback === 'error' ? 'border-red-500 bg-red-50 animate-pulse' : 'border-slate-300 bg-slate-50'}`} dir="ltr">
            {selected.length === 0 && <span className="text-slate-400 font-bold mx-auto text-center w-full">الكلمات المحددة تظهر هنا...</span>}
            {selected.map((w, i) => (
              <button key={i} onClick={() => removeWord(w, i)} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2.5 rounded-xl text-lg transition-transform active:scale-95 shadow-sm">{w}</button>
            ))}
          </div>

          <div className="flex flex-wrap gap-3 justify-center mb-10" dir="ltr">
            {available.map((w, i) => (
              <button key={i} onClick={() => selectWord(w, i)} className="bg-white border-2 border-slate-200 text-slate-800 font-bold px-5 py-3 rounded-xl text-lg shadow-sm hover:bg-slate-50 transition-transform active:scale-95">{w}</button>
            ))}
          </div>

          <div className="flex justify-center gap-4">
            {selected.length > 0 && (
               <button onClick={resetLevel} className="bg-slate-200 text-slate-700 font-bold px-5 py-3 rounded-full flex items-center gap-2 hover:bg-slate-300 transition-colors">
                 {Icons.reset} مسح
               </button>
            )}
            {available.length === 0 && (
              <button onClick={checkSentence} className="bg-emerald-500 hover:bg-emerald-600 text-white font-black text-xl px-12 py-3 rounded-full shadow-lg transition-transform active:scale-95">
                تحقق من الإجابة
              </button>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // 5. مصنع الكلمات والقواعد الخاصة
    // ==========================================
    function WordFactory({ playTTS }) {
      const [levelIndex, setLevelIndex] = useState(0);
      const [feedback, setFeedback] = useState(null);
      const level = wordFactoryLevels[levelIndex];

      const handleChoice = (letter) => {
        if (letter === level.prefix) {
          setFeedback('success'); playTTS(level.word);
          setTimeout(() => {
            if (levelIndex + 1 < wordFactoryLevels.length) { setLevelIndex(levelIndex + 1); setFeedback(null); }
            else { alert("كفو! أنهيت جميع الكلمات المتاحة بمصنع الكلمات!"); setLevelIndex(0); setFeedback(null); }
          }, 2000);
        } else { setFeedback('error'); setTimeout(() => setFeedback(null), 1000); }
      };

      return (
        <div className="bg-white rounded-3xl shadow-xl p-8 max-w-2xl mx-auto text-center border border-slate-100 animate-fadeIn">
          <h2 className="text-3xl font-black mb-8 text-blue-600">🧩 مصنع الكلمات</h2>
          <div className="mb-6 bg-blue-500 text-white p-4 rounded-2xl inline-block text-2xl font-black px-8">{level.meaning}</div>
          <div className="flex justify-center items-center gap-4 mb-12 text-5xl font-black" dir="ltr">
            <div className={`w-24 h-24 border-4 border-dashed rounded-2xl flex items-center justify-center transition-colors ${feedback === 'success' ? 'border-green-500 text-green-600 bg-green-50' : feedback === 'error' ? 'border-red-500 text-red-500 bg-red-50' : 'border-slate-300 text-slate-400'}`}>
              {feedback === 'success' ? level.prefix : '?'}
            </div>
            <div className="text-slate-800">{level.family}</div>
          </div>
          <div className="flex justify-center gap-4" dir="ltr">
            {level.options.map((l, i) => (
              <button key={i} onClick={() => handleChoice(l)} className="w-20 h-20 bg-slate-800 text-white rounded-2xl text-2xl font-black shadow-[0_5px_0_#0f172a] active:translate-y-1 transition-all">{l}</button>
            ))}
          </div>
        </div>
      );
    }

    function SpecialPatterns({ playTTS }) {
      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 animate-fadeIn">
          {specialPatternsData.map((p, i) => (
            <div key={i} className="bg-white p-6 rounded-3xl shadow-md border-t-4 border-orange-500 flex flex-col">
              <div className="flex justify-between mb-4 items-center">
                <span className="text-4xl font-black text-orange-600 font-mono" dir="ltr">{p.pattern}</span>
                <span className="bg-orange-100 text-orange-800 px-4 py-2 rounded-xl font-bold">{p.sound}</span>
              </div>
              <p className="text-slate-600 mb-6 text-sm font-bold flex-1">{p.explanation}</p>
              <div className="space-y-2 border-t border-slate-100 pt-4">
                {p.examples.map((ex, idx) => (
                  <div key={idx} className="bg-slate-50 p-3 rounded-xl flex justify-between items-center">
                    <div>
                      <span className="font-black text-lg block text-slate-800" dir="ltr">{ex.word}</span>
                      <span className="text-xs text-slate-500 font-bold">{ex.meaning}</span>
                    </div>
                    <button onClick={() => playTTS(ex.word)} className="bg-white border border-slate-200 p-2.5 rounded-full text-orange-600 hover:bg-orange-500 hover:text-white transition-colors active:scale-90">{Icons.volume}</button>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
