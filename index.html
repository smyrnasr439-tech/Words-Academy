  <script type="text/text/babel">
    const { useState, useEffect } = React;

    // --- مفتاح الذكاء الاصطناعي للصوت ---
    const apiKey = ""; 

    function writeString(view, offset, string) {
      for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
    }

    function pcmToWav(pcmBase64, sampleRate = 24000) {
      const binaryString = atob(pcmBase64);
      const len = binaryString.length;
      const buffer = new ArrayBuffer(44 + len);
      const view = new DataView(buffer);
      
      writeString(view, 0, 'RIFF'); view.setUint32(4, 36 + len, true);
      writeString(view, 8, 'WAVE'); writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true); view.setUint16(20, 1, true);
      view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true);
      view.setUint16(34, 16, true); writeString(view, 36, 'data');
      view.setUint32(40, len, true);
      
      for (let i = 0; i < len; i++) view.setUint8(44 + i, binaryString.charCodeAt(i));
      const blob = new Blob([buffer], { type: 'audio/wav' });
      return URL.createObjectURL(blob);
    }

    // --- قاعدة البيانات الكبرى (الموسوعة الشاملة) ---
    const familyDictionary = {
      "Short A (صوت أَ القصير)": {
        at: [{ word: 'Bat', meaning: 'مضرب / خفاش', sound: 'بَاتْ' }, { word: 'Cat', meaning: 'قطة', sound: 'كَاتْ' }, { word: 'Hat', meaning: 'قبعة', sound: 'هَاتْ' }, { word: 'Mat', meaning: 'سجادة', sound: 'مَاتْ' }, { word: 'Rat', meaning: 'جرذ', sound: 'رَاتْ' }],
        an: [{ word: 'Man', meaning: 'رجل', sound: 'مَانْ' }, { word: 'Can', meaning: 'يستطيع / علبة', sound: 'كَانْ' }, { word: 'Fan', meaning: 'مروحة', sound: 'فَانْ' }, { word: 'Van', meaning: 'شاحنة', sound: 'فَانْ' }],
        ad: [{ word: 'Sad', meaning: 'حزين', sound: 'سَادْ' }, { word: 'Dad', meaning: 'أب', sound: 'دَادْ' }, { word: 'Bad', meaning: 'سيء', sound: 'بَادْ' }, { word: 'Mad', meaning: 'غاضب', sound: 'مَادْ' }],

      },
      "Short E (صوت إِ السريع)": {
        et: [{ word: 'Pet', meaning: 'أليف', sound: 'بِتْ' }, { word: 'Net', meaning: 'شبكة', sound: 'نِتْ' }, { word: 'Wet', meaning: 'مبلل', sound: 'وِتْ' }],
        en: [{ word: 'Pen', meaning: 'قلم', sound: 'بِنْ' }, { word: 'Ten', meaning: 'عشرة', sound: 'تِنْ' }, { word: 'Hen', meaning: 'دجاجة', sound: 'هِنْ' }]
      },
      "Short I (كسرة قوية)": {
        in: [{ word: 'Win', meaning: 'يفوز', sound: 'وِنْ' }, { word: 'Pin', meaning: 'دبوس', sound: 'بِنْ' }],
        it: [{ word: 'Sit', meaning: 'يجلس', sound: 'سِتْ' }, { word: 'Hit', meaning: 'يضرب', sound: 'هِتْ' }],
        ice: [{ word: 'Ice', meaning: 'ثلج', sound: 'آيْس' }, { word: 'Rice', meaning: 'أرز', sound: 'رَايْس' }, { word: 'Nice', meaning: 'لطيف', sound: 'نَايْس' }],
        ight: [{ word: 'Night', meaning: 'الليل', sound: 'نَايْت' }, { word: 'Light', meaning: 'ضوء', sound: 'لَايْت' }]
      },
      "Short O (صوت آو سريع)": {
        ot: [{ word: 'Hot', meaning: 'حار', sound: 'هَاتْ' }, { word: 'Pot', meaning: 'وعاء', sound: 'بَاتْ' }],
        op: [{ word: 'Hop', meaning: 'يقفز', sound: 'هَابْ' }, { word: 'Top', meaning: 'القمة', sound: 'تَابْ' }]
      },
      "Short U (صوت أَ مفخم)": {
        ug: [{ word: 'Bug', meaning: 'حشرة', sound: 'بَغْ' }, { word: 'Mug', meaning: 'كوب', sound: 'مَغْ' }],
        un: [{ word: 'Sun', meaning: 'شمس', sound: 'سَنْ' }, { word: 'Fun', meaning: 'مرح', sound: 'فَنْ' }]
      }
    };

    const specialPatternsData = [
      { pattern: "ph", sound: "فْ (صوت حرف F)", explanation: "اندماج حرفي P و H لينطقا كحرف الفاء العربي تماماً.", examples: [{ word: "Phone", meaning: "هاتف", sound: "فُونْ" }, { word: "Photo", meaning: "صورة", sound: "فُوتُو" }] },
      { pattern: "-ice", sound: "آيْسْ (Soft C)", explanation: "ينطق حرف C كـ (S) إذا جاء بعده حرف e. وحرف الـ I طويل وممدود.", examples: [{ word: "Ice", meaning: "ثلج", sound: "آيْسْ" }, { word: "Rice", meaning: "أرز", sound: "رَايْسْ" }, { word: "Nice", meaning: "لطيف", sound: "نَايْسْ" }] },
      { pattern: "-tion", sound: "شِن (sh-un)", explanation: "مقطع شهير جداً ينطق شِن ويقوم بتحويل الأفعال لأسماء.", examples: [{ word: "Action", meaning: "فعل/حركة", sound: "أَكْـ شِن" }, { word: "Option", meaning: "خيار", sound: "أُوبْـ شِن" }] },

    ];

    const wordFactoryLevels = [
      { word: 'Ice', prefix: 'I', family: 'ce', meaning: 'ثلج', options: ['I', 'A', 'O'] },
      { word: 'Phone', prefix: 'Ph', family: 'one', meaning: 'هاتف', options: ['Sh', 'Ch', 'Ph'] },
      { word: 'Night', prefix: 'N', family: 'ight', meaning: 'ليل', options: ['M', 'N', 'L'] },
      { word: 'Rice', prefix: 'R', family: 'ice', meaning: 'أرز', options: ['R', 'P', 'N'] }
    ];

    const sentenceLevels = [
      { sentence: ['He', 'is', 'playing', 'a', 'game'], text: "He is playing a game", meaning: 'هو يلعب لعبة (الآن)', scrambled: ['a', 'playing', 'He', 'game', 'is'] },
      { sentence: ['The', 'night', 'is', 'beautiful'], text: "The night is beautiful", meaning: 'الليل جميل', scrambled: ['beautiful', 'is', 'night', 'The'] }
    ];

    // --- أيقونات التطبيق بصيغة SVG لتعمل بدون إنترنت ---
    const Icons = {
      home: <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
      settings: <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,
      upload: <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
      wifi: <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" x2="12.01" y1="20" y2="20"/></svg>,
      wifiOff: <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="2" x2="22" y1="2" y2="22"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" x2="12.01" y1="20" y2="20"/><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/></svg>,
      volume: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>,
      loader: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
      puzzle: <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M11.5 5a2.5 2.5 0 0 1 5 0V7h1.5A2.5 2.5 0 0 1 20.5 9.5V11h-2a2.5 2.5 0 0 0 0 5h2v1.5a2.5 2.5 0 0 1-2.5 2.5H16.5v-2a2.5 2.5 0 0 0-5 0v2H10A2.5 2.5 0 0 1 7.5 18V16.5h2a2.5 2.5 0 0 0 0-5h-2V9.5A2.5 2.5 0 0 1 10 7h1.5V5z"/></svg>,
      play: <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>,
      book: <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
      sparkles: <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>,
      check: <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>,
      x: <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>
    };

    function App() {
      const [currentScreen, setCurrentScreen] = useState('menu');
      const [loadingText, setLoadingText] = useState(null); 
      const [offlineMode, setOfflineMode] = useState(false);
      const [appLogo, setAppLogo] = useState(null);
      const [showSettings, setShowSettings] = useState(false);

      useEffect(() => {
        const savedLogo = localStorage.getItem('app_logo_base64');
        if (savedLogo) setAppLogo(savedLogo);

        const savedMode = localStorage.getItem('app_offline_mode');
        if (savedMode) setOfflineMode(savedMode === 'true');

        const initSpeech = () => {
          if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
        };
        window.addEventListener('click', initSpeech, { once: true });
        window.addEventListener('touchstart', initSpeech, { once: true });
        return () => {
          window.removeEventListener('click', initSpeech);
          window.removeEventListener('touchstart', initSpeech);
        };
      }, []);

      const toggleOfflineMode = () => {
        const nextMode = !offlineMode;
        setOfflineMode(nextMode);
        localStorage.setItem('app_offline_mode', String(nextMode));
      };

      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            const base64String = reader.result;
            setAppLogo(base64String);
            localStorage.setItem('app_logo_base64', base64String);
          };
          reader.readAsDataURL(file);
        }
      };

      const clearLogo = () => {
        setAppLogo(null);
        localStorage.removeItem('app_logo_base64');
      };

      const playAudioIntelligent = async (text) => {
        setLoadingText(text);

        if (offlineMode || !apiKey) {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            utterance.onend = () => setLoadingText(null);
            utterance.onerror = () => setLoadingText(null);
            window.speechSynthesis.speak(utterance);
          } else {
            alert("محرك الصوت مفقود.");
            setLoadingText(null);
          }
          return;
        }

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;
        const payload = {
          contents: [{ parts: [{ text: `Say clearly: ${text}` }] }],
          generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } } },
          model: "gemini-2.5-flash-preview-tts"
        };

        try {
          const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          if (!response.ok) throw new Error("API Limit");
          const data = await response.json();
          const pcmData = data.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
          
          if (pcmData) {
            const audioUrl = pcmToWav(pcmData, 24000);
            const audio = new Audio(audioUrl);
            audio.onended = () => setLoadingText(null);
            audio.play().catch(() => {
              setOfflineMode(true);
              setLoadingText(null);
            });
          } else throw new Error("Null");
        } catch (error) {
          setOfflineMode(true);
          localStorage.setItem('app_offline_mode', 'true');
          if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            utterance.onend = () => setLoadingText(null);
            window.speechSynthesis.speak(utterance);
          } else {
            setLoadingText(null);
          }
        }
      };

      const navigate = (screen) => {
        window.scrollTo(0, 0);
        setCurrentScreen(screen);
        setShowSettings(false);
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans pb-12" dir="rtl">
          <header className="bg-indigo-900 text-white p-4 shadow-lg sticky top-0 z-50 flex justify-between items-center">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 bg-white rounded-full flex items-center justify-center overflow-hidden border-2 border-yellow-400">
                <img 
                  src={appLogo || "logo.2.png"} 
                  alt="Logo" 
                  className="w-full h-full object-cover" 
                  onError={(e) => {
                    e.target.style.display = 'none';
                    e.target.parentNode.innerHTML = '<span class="text-indigo-900 text-[10px] font-black">أكاديمية<br/>ماجد</span>';
                  }}
                />
              </div>
              <div>
                <h1 className="text-lg md:text-xl font-black text-transparent bg-clip-text bg-gradient-to-l from-yellow-300 to-yellow-500">
                  أكاديمية الكلمات V5.2
                </h1>
                <p className="text-[10px] text-indigo-200 font-medium">تطوير خاص لـ ماجد</p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button onClick={toggleOfflineMode} className={`flex items-center gap-2 px-3 py-1.5 rounded-full font-bold text-xs transition-all border ${offlineMode ? 'bg-orange-500 border-orange-400' : 'bg-green-500 border-green-400'}`}>
                {offlineMode ? Icons.wifiOff : Icons.wifi}
                <span className="hidden md:inline">{offlineMode ? 'بدون نت نشط' : 'صوت ذكي HD'}</span>
              </button>

              <button onClick={() => setShowSettings(!showSettings)} className="bg-indigo-800 hover:bg-indigo-700 p-2 rounded-full transition-colors text-white">
                {Icons.settings}
              </button>

              {currentScreen !== 'menu' && (
                <button onClick={() => navigate('menu')} className="bg-yellow-500 hover:bg-yellow-600 text-indigo-950 p-2 md:px-4 md:py-2 rounded-full transition-all font-black flex items-center gap-1">
                  {Icons.home}
                  <span className="hidden md:inline">الرئيسية</span>
                </button>
              )}
            </div>
          </header>

          {showSettings && (
            <div className="bg-white border-b-2 border-slate-200 p-6 shadow-inner animate-fadeIn">
              <div className="max-w-4xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
                <div className="text-center md:text-right">
                  <h3 className="text-xl font-black text-indigo-900 mb-2">لوحة تعديل الشعار الخاص بك</h3>
                  <p className="text-sm text-slate-500">ارفع صورة من جهازك لتحفظ كشعار لك داخل التطبيق.</p>
                </div>
                <div className="flex items-center gap-4">
                  <label className="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-3 rounded-2xl font-bold text-sm cursor-pointer shadow-md flex items-center gap-2 transition-transform active:scale-95">
                    {Icons.upload} رفع شعار جديد
                    <input type="file" accept="image/*" className="hidden" onChange={handleLogoUpload} />
                  </label>
                  {appLogo && (
                    <button onClick={clearLogo} className="bg-red-100 hover:bg-red-200 text-red-600 px-4 py-3 rounded-2xl font-bold text-sm transition-all">إزالة</button>
                  )}
                </div>
              </div>
            </div>
          )}

          <main className="p-4 max-w-6xl mx-auto mt-4">
            {currentScreen === 'menu' && <MainMenu onNavigate={navigate} />}
            {currentScreen === 'factory' && <WordFactory playTTS={playAudioIntelligent} loadingText={loadingText} />}
            {currentScreen === 'sentence' && <SentenceBuilder playTTS={playAudioIntelligent} loadingText={loadingText} />}
            {currentScreen === 'dict' && <BasicDictionary playTTS={playAudioIntelligent} loadingText={loadingText} />}
            {currentScreen === 'patterns' && <SpecialPatterns playTTS={playAudioIntelligent} loadingText={loadingText} />}
          </main>
        </div>
      );
    }

    function MainMenu({ onNavigate }) {
      return (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mt-8">
          <MenuCard icon={Icons.puzzle} title="مصنع الكلمات" desc="ركب الحروف مع العائلات" color="blue" onClick={() => onNavigate('factory')} />
          <MenuCard icon={Icons.play} title="صانع الجمل" desc="رتب الكلمات لتكوين جمل" color="green" onClick={() => onNavigate('sentence')} />
          <MenuCard icon={Icons.book} title="الموسوعة الكبرى" desc="جميع عائلات الحروف" color="purple" onClick={() => onNavigate('dict')} />
          <MenuCard icon={Icons.sparkles} title="المقاطع والتشكيلات" desc="قواعد نطق ph, ice, ing" color="orange" onClick={() => onNavigate('patterns')} />
        </div>
      );
    }

    function MenuCard({ icon, title, desc, color, onClick }) {
      const colorMap = {
        blue: 'bg-blue-50 text-blue-600 border-blue-500', green: 'bg-green-50 text-green-600 border-green-500',
        purple: 'bg-purple-50 text-purple-600 border-purple-500', orange: 'bg-orange-50 text-orange-600 border-orange-500',
      };
      return (
        <div onClick={onClick} className={`bg-white rounded-3xl shadow-lg p-6 flex flex-col items-center justify-center cursor-pointer hover:-translate-y-2 hover:shadow-2xl transition-all border-b-4 border-t border-r border-l ${colorMap[color].split(' ')[2]}`}>
          <div className={`p-4 rounded-full mb-4 ${colorMap[color].split(' ')[0]} ${colorMap[color].split(' ')[1]}`}>{icon}</div>
          <h2 className="text-2xl font-bold mb-2 text-slate-800 text-center">{title}</h2>
          <p className="text-center text-slate-500 font-medium">{desc}</p>
        </div>
      );
    }

    function SpecialPatterns({ playTTS, loadingText }) {
      return (
        <div className="max-w-5xl mx-auto space-y-8 animate-fadeIn">
          <div className="text-center mb-10">
            <h2 className="text-3xl font-black text-orange-600 flex items-center justify-center gap-3 mb-4">
              <span className="text-orange-500">{Icons.sparkles}</span> المقاطع والتشكيلات
            </h2>
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
            {specialPatternsData.map((item, index) => (
              <div key={index} className="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100 flex flex-col">
                <div className="bg-gradient-to-r from-orange-500 to-red-500 p-6 flex justify-between items-center text-white">
                  <h3 className="text-4xl font-black" dir="ltr">{item.pattern}</h3>
                  <span className="bg-white text-orange-600 font-bold px-4 py-2 rounded-xl text-xl">{item.sound}</span>
                </div>
                <div className="p-6 flex-1 bg-orange-50/10">
                  <p className="text-lg text-slate-700 font-medium leading-relaxed mb-6">{item.explanation}</p>
                  <div className="space-y-4">
                    {item.examples.map((ex, i) => (
                      <div key={i} className="flex items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                        <div className="text-right">
                          <p className="font-bold text-slate-800 text-lg">{ex.meaning}</p>
                          <p className="text-sm text-slate-500">{ex.sound}</p>
                        </div>
                        <div className="flex items-center gap-4" dir="ltr">
                          <span className="text-2xl font-black text-slate-800">{ex.word}</span>
                          <button onClick={() => playTTS(ex.word)} className="bg-orange-100 text-orange-600 p-3 rounded-full flex items-center justify-center">
                            {loadingText === ex.word ? Icons.loader : Icons.volume}
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function BasicDictionary({ playTTS, loadingText }) {
      return (
        <div className="space-y-12 max-w-6xl mx-auto animate-fadeIn">
          <div className="text-center mb-12">
            <h2 className="text-3xl font-black text-purple-700 flex items-center justify-center gap-3">
              <span className="text-purple-600">{Icons.book}</span> الموسوعة الشاملة
            </h2>
          </div>
          {Object.entries(familyDictionary).map(([vowelGroup, families]) => (
            <div key={vowelGroup} className="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">
              <div className="bg-gradient-to-r from-indigo-800 to-purple-700 p-6 text-white">
                <h3 className="text-2xl font-black">{vowelGroup}</h3>
              </div>
              <div className="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 bg-slate-50">
                {Object.entries(families).map(([family, words]) => (
                  <div key={family} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                    <h4 className="text-2xl font-black text-purple-800 mb-4 pb-2 border-b-2 border-purple-100 text-center" dir="ltr">-{family}</h4>
                    <ul className="space-y-3">
                      {words.map((item, idx) => (
                        <li key={idx} className="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100">
                          <div className="text-right flex-1">
                            <p className="font-bold text-slate-800">{item.meaning}</p>
                            <p className="text-sm font-medium text-slate-500">{item.sound}</p>
                          </div>
                          <div className="flex items-center gap-3 ml-4" dir="ltr">
                            <span className="font-black text-xl text-purple-900">{item.word}</span>
                            <button onClick={() => playTTS(item.word)} className="bg-purple-100 text-purple-700 p-2 rounded-full" disabled={loadingText === item.word}>
                              {loadingText === item.word ? Icons.loader : Icons.volume}
                            </button>
                          </div>
                        </li>
                      ))}
                    </ul>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      );
    }

    function WordFactory({ playTTS, loadingText }) {
      const [levelIndex, setLevelIndex] = useState(0);
      const [feedback, setFeedback] = useState(null);
      const [completed, setCompleted] = useState(false);
      const level = wordFactoryLevels[levelIndex];

      const handleChoice = (letter) => {
        if (letter === level.prefix) {
          setFeedback('success'); playTTS(level.word);
          setTimeout(() => { if (levelIndex + 1 < wordFactoryLevels.length) { setLevelIndex(levelIndex + 1); setFeedback(null); } else setCompleted(true); }, 2000);
        } else { setFeedback('error'); setTimeout(() => setFeedback(null), 1000); }
      };
      if (completed) return <SuccessScreen title="أنهيت مصنع الكلمات بنجاح!" onRestart={() => {setLevelIndex(0); setCompleted(false);}} />;

      return (
        <div className="bg-white rounded-3xl shadow-xl p-8 max-w-2xl mx-auto text-center border border-slate-100 animate-fadeIn">
          <h2 className="text-3xl font-black mb-8 text-blue-600 flex justify-center items-center gap-3">
            <span className="text-blue-500">{Icons.puzzle}</span> مصنع الكلمات
          </h2>
          <div className="mb-8">
            <p className="text-xl mb-3 text-slate-600 font-bold">اصنع كلمة بمعنى:</p>
            <div className="flex justify-center items-center gap-3">
              <p className="text-3xl font-black text-white bg-blue-500 px-8 py-3 rounded-2xl">{level.meaning}</p>
              <button onClick={() => playTTS(level.word)} className="bg-indigo-100 p-3 rounded-2xl text-indigo-700">
                {loadingText === level.word ? Icons.loader : Icons.volume}
              </button>
            </div>
          </div>
          <div className="flex justify-center items-center gap-4 mb-12" dir="ltr">
            <div className={`w-28 h-28 border-4 border-dashed rounded-3xl flex items-center justify-center text-5xl font-black ${feedback === 'success' ? 'border-green-500 text-green-600 bg-green-50' : feedback === 'error' ? 'border-red-500 text-red-600 bg-red-50' : 'border-slate-300 text-slate-400'}`}>
              {feedback === 'success' ? level.prefix : '?'}
            </div>
            <div className="text-6xl font-black text-slate-800 tracking-wide">{level.family}</div>
          </div>
          <div className="flex justify-center gap-4" dir="ltr">
            {level.options.map((letter, idx) => (
              <button key={idx} onClick={() => handleChoice(letter)} disabled={feedback === 'success'} className="w-20 h-20 bg-slate-800 text-white rounded-3xl text-3xl font-black shadow-[0_6px_0_#0f172a] active:translate-y-[6px] transition-all disabled:opacity-50">{letter}</button>
            ))}
          </div>
        </div>
      );
    }

    function SentenceBuilder({ playTTS, loadingText }) {
      const [levelIndex, setLevelIndex] = useState(0);
      const [selectedWords, setSelectedWords] = useState([]);
      const [availableWords, setAvailableWords] = useState([]);
      const [feedback, setFeedback] = useState(null);
      const [completed, setCompleted] = useState(false);
      const level = sentenceLevels[levelIndex];

      useEffect(() => { if (level) { setAvailableWords([...level.scrambled]); setSelectedWords([]); setFeedback(null); } }, [levelIndex, level]);
      const handleWordSelect = (word, index) => { setSelectedWords([...selectedWords, word]); const newAvail = [...availableWords]; newAvail.splice(index, 1); setAvailableWords(newAvail); };
      const handleWordRemove = (word, index) => { const newSel = [...selectedWords]; newSel.splice(index, 1); setSelectedWords(newSel); setAvailableWords([...availableWords, word]); };
      
      const checkAnswer = () => {
        const str = selectedWords.join(' ');
        if (str === level.sentence.join(' ')) { setFeedback('success'); playTTS(level.text); setTimeout(() => { if (levelIndex + 1 < sentenceLevels.length) setLevelIndex(levelIndex + 1); else setCompleted(true); }, 3000); }
        else { setFeedback('error'); setTimeout(() => setFeedback(null), 1500); }
      };
      if (completed) return <SuccessScreen title="أنهيت صانع الجمل بنجاح!" onRestart={() => {setLevelIndex(0); setCompleted(false);}} />;

      return (
        <div className="bg-white rounded-3xl shadow-xl p-8 max-w-3xl mx-auto border border-slate-100 animate-fadeIn">
          <h2 className="text-3xl font-black mb-8 text-green-600 text-center flex justify-center items-center gap-3">
            <span className="text-green-500">{Icons.play}</span> صانع الجمل
          </h2>
          <div className="text-center mb-8 flex justify-center items-center gap-3">
            <p className="text-2xl font-black text-green-800 bg-green-100 px-8 py-3 rounded-2xl">{level.meaning}</p>
            <button onClick={() => playTTS(level.text)} className="bg-green-200 text-green-800 p-3 rounded-2xl">
              {loadingText === level.text ? Icons.loader : Icons.volume}
            </button>
          </div>
          <div className={`min-h-[100px] p-6 border-4 border-dashed rounded-3xl mb-8 flex flex-wrap gap-4 items-center justify-start ${feedback === 'success' ? 'border-green-500 bg-green-50' : feedback === 'error' ? 'border-red-500 bg-red-50' : 'border-slate-300 bg-slate-50'}`} dir="ltr">
            {selectedWords.length === 0 && !feedback && <span className="text-slate-400 font-bold mx-auto">رتب الكلمات هنا...</span>}
            {selectedWords.map((word, idx) => <button key={idx} onClick={() => handleWordRemove(word, idx)} disabled={feedback === 'success'} className="px-5 py-3 bg-indigo-600 text-white font-bold text-xl rounded-xl">{word}</button>)}
          </div>
          <div className="flex flex-wrap gap-4 justify-center mb-10" dir="ltr">
            {availableWords.map((word, idx) => <button key={idx} onClick={() => handleWordSelect(word, idx)} disabled={feedback === 'success'} className="px-6 py-3 bg-white border-2 border-slate-200 text-slate-800 font-bold text-xl rounded-xl shadow-[0_4px_0_#cbd5e1]">{word}</button>)}
          </div>
          {availableWords.length === 0 && feedback !== 'success' && (
            <div className="text-center"><button onClick={checkAnswer} className="px-10 py-4 bg-green-500 text-white font-black text-2xl rounded-full shadow-[0_6px_0_#16a34a] active:translate-y-[6px]">تحقق من الإجابة</button></div>
          )}
        </div>
      );
    }

    function SuccessScreen({ title, onRestart }) {
      return (
        <div className="bg-white rounded-3xl shadow-2xl p-12 text-center max-w-lg mx-auto mt-12 animate-fadeIn">
          <div className="text-yellow-400 flex justify-center mb-8">
            <svg width="80" height="80" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
          </div>
          <h2 className="text-4xl font-black text-slate-800 mb-4">{title}</h2>
          <button onClick={onRestart} className="px-8 py-4 bg-blue-600 text-white font-black text-xl rounded-full shadow-lg transition-transform active:scale-95">العب مرة أخرى</button>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
