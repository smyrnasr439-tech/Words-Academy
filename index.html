      { word: 'Bake', prefix: 'B', family: 'ake', meaning: 'يخبز بالفرن', options: ['B', 'C', 'M'] }
    ];

    const phraseLevels = [
      { correct: ["The", "cat", "is", "on", "the", "mat"], words: ["on", "cat", "The", "mat", "is", "the"], meaning: "القطة على السجادة" },
      { correct: ["I", "eat", "rice", "and", "meat"], words: ["and", "I", "meat", "rice", "eat"], meaning: "أنا آكل الأرز واللحم" },
      { correct: ["This", "is", "my", "new", "phone"], words: ["my", "This", "phone", "is", "new"], meaning: "هذا هو هاتفي الجديد" },
      { correct: ["The", "sun", "is", "very", "bright", "today"], words: ["today", "sun", "is", "bright", "very", "The"], meaning: "الشمس ساطعة جداً اليوم" },
      { correct: ["We", "play", "in", "the", "clean", "lake"], words: ["lake", "We", "play", "clean", "the", "in"], meaning: "نحن نلعب في البحيرة النظيفة" },
      { correct: ["He", "has", "ten", "green", "pens"], words: ["green", "He", "pens", "has", "ten"], meaning: "هو لديه عشرة أقلام خضراء" }
    ];

    function App() {
      const [currentScreen, setCurrentScreen] = useState('menu');
      const [loadingText, setLoadingText] = useState(null);

      const playAudioIntelligent = async (text) => {
        if (!apiKey) {
          useFallbackTTS(text);
          return;
        }
        setLoadingText("جاري تشغيل الصوت بالذكاء الاصطناعي...");
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: `Generate slow, educational pronunciation audio in American English for the phrase: "${text}".` }] }],
              generationConfig: { responseMimeType: "application/json" }
            })
          });
          const data = await response.json();
          const pcmBase64 = data.candidates[0].content.parts[0].text; 
          const audioUrl = pcmToWav(pcmBase64);
          const audio = new Audio(audioUrl);
          audio.play();
        } catch (e) {
          useFallbackTTS(text);
        } finally {
          setLoadingText(null);
        }
      };

      const useFallbackTTS = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          utterance.rate = 0.8;
          window.speechSynthesis.speak(utterance);
        }
      };

      const getIcon = (name) => {
        switch(name) {
          case 'home': return <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
          case 'volume': return <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="inline-block"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>;
          case 'puzzle': return <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M11.5 5a2.5 2.5 0 0 1 5 0V7h1.5A2.5 2.5 0 0 1 20.5 9.5V11h-2a2.5 2.5 0 0 0 0 5h2v1.5a2.5 2.5 0 0 1-2.5 2.5H16.5v-2a2.5 2.5 0 0 0-5 0v2H10A2.5 2.5 0 0 1 7.5 18V16.5h2a2.5 2.5 0 0 0 0-5h-2V9.5A2.5 2.5 0 0 1 10 7h1.5V5z"/></svg>;
          case 'book': return <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>;
          case 'sparkles': return <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>;
          case 'game': return <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="12" x="2" y="6" rx="2"/><path d="M6 12h4M8 10v4M15 13v.01M18 11v.01"/></svg>;
          default: return null;
        }
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 pb-12">
          {loadingText && (
            <div className="fixed top-4 left-4 bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-lg z-50 animate-bounce">
              {loadingText}
            </div>
          )}

          <header className="bg-indigo-950 text-white p-5 shadow-lg flex justify-between items-center">
            <div>
              <h1 className="text-xl font-black text-yellow-400">أكاديمية الكلمات الذكية 🎓</h1>
              <p className="text-xs text-indigo-200">تطوير مخصص وشامل لـ ماجد</p>
            </div>
            {currentScreen !== 'menu' && (
              <button onClick={() => setCurrentScreen('menu')} className="bg-yellow-500 hover:bg-yellow-600 text-indigo-950 px-4 py-2 rounded-full font-black flex items-center gap-1 transition-transform active:scale-95">
                {getIcon('home')} الرئيسية
              </button>
            )}
          </header>

          <main className="p-4 max-w-6xl mx-auto mt-6">
            {currentScreen === 'menu' && <MainMenu onNavigate={setCurrentScreen} getIcon={getIcon} />}
            {currentScreen === 'factory' && <WordFactory playTTS={playAudioIntelligent} />}
            {currentScreen === 'dict' && <BasicDictionary playTTS={playAudioIntelligent} getIcon={getIcon} />}
            {currentScreen === 'patterns' && <SpecialPatterns playTTS={playAudioIntelligent} getIcon={getIcon} />}
            {currentScreen === 'phraseGame' && <PhraseBuilderGame playTTS={playAudioIntelligent} getIcon={getIcon} />}
          </main>
        </div>
      );
    }

    function MainMenu({ onNavigate, getIcon }) {
      return (
        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mt-8">
          <div onClick={() => onNavigate('factory')} className="bg-white rounded-3xl shadow-xl p-6 flex flex-col items-center justify-center cursor-pointer hover:-translate-y-2 border-b-4 border-blue-500 transition-all">
            <div className="p-4 rounded-full bg-blue-50 text-blue-600 mb-4">{getIcon('puzzle')}</div>
            <h2 className="text-2xl font-bold mb-2">مصنع الكلمات</h2>
            <p className="text-slate-500 text-sm text-center">تركيب الحروف لبناء عائلات الكلمات</p>
          </div>
          <div onClick={() => onNavigate('dict')} className="bg-white rounded-3xl shadow-xl p-6 flex flex-col items-center justify-center cursor-pointer hover:-translate-y-2 border-b-4 border-purple-500 transition-all">
            <div className="p-4 rounded-full bg-purple-50 text-purple-600 mb-4">{getIcon('book')}</div>
            <h2 className="text-2xl font-bold mb-2">الموسوعة الشاملة</h2>
            <p className="text-slate-500 text-sm text-center">دليل عائلات الكلمات من A إلى Z</p>
          </div>
          <div onClick={() => onNavigate('patterns')} className="bg-white rounded-3xl shadow-xl p-6 flex flex-col items-center justify-center cursor-pointer hover:-translate-y-2 border-b-4 border-orange-500 transition-all">
            <div className="p-4 rounded-full bg-orange-50 text-orange-600 mb-4">{getIcon('sparkles')}</div>
            <h2 className="text-2xl font-bold mb-2">المقاطع الصوتية</h2>
            <p className="text-slate-500 text-sm text-center">نطق الأحرف المركبة والقواعد المتقدمة</p>
          </div>
          <div onClick={() => onNavigate('phraseGame')} className="bg-white rounded-3xl shadow-xl p-6 flex flex-col items-center justify-center cursor-pointer hover:-translate-y-2 border-b-4 border-emerald-500 transition-all">
            <div className="p-4 rounded-full bg-emerald-50 text-emerald-600 mb-4">{getIcon('game')}</div>
            <h2 className="text-2xl font-bold mb-2">تحدي الجمل</h2>
            <p className="text-slate-500 text-sm text-center">ترتيب الكلمات لتكوين جمل إنجليزية كاملة</p>
          </div>
        </div>
      );
    }

    function WordFactory({ playTTS }) {
      const [levelIndex, setLevelIndex] = useState(0);
      const [feedback, setFeedback] = useState(null);
      const level = wordFactoryLevels[levelIndex];

      const handleChoice = (letter) => {
        if (letter === level.prefix) {
          setFeedback('success'); playTTS(level.word);
          setTimeout(() => {
            if (levelIndex + 1 < wordFactoryLevels.length) { setLevelIndex(levelIndex + 1); setFeedback(null); }
            else { alert("كفو يا بطل! أنهيت جميع مستويات مصنع الكلمات!"); setLevelIndex(0); setFeedback(null); }
          }, 2000);
        } else { setFeedback('error'); setTimeout(() => setFeedback(null), 1000); }
      };

      return (
        <div className="bg-white rounded-3xl shadow-xl p-8 max-w-2xl mx-auto text-center border border-slate-100 animate-fadeIn">
          <h2 className="text-3xl font-black mb-8 text-blue-600">🧩 مصنع الكلمات</h2>
          <div className="mb-6 bg-blue-500 text-white p-4 rounded-2xl inline-block text-2xl font-black px-8">{level.meaning}</div>
          <div className="flex justify-center items-center gap-4 mb-12 text-5xl font-black" dir="ltr">
            <div className={`w-24 h-24 border-4 border-dashed rounded-2xl flex items-center justify-center ${feedback === 'success' ? 'border-green-500 text-green-600 bg-green-50' : 'border-slate-300 text-slate-400'}`}>
              {feedback === 'success' ? level.prefix : '?'}
            </div>
            <div>{level.family}</div>
          </div>
          <div className="flex justify-center gap-4" dir="ltr">
            {level.options.map((l, i) => (
              <button key={i} onClick={() => handleChoice(l)} className="w-20 h-20 bg-slate-800 text-white rounded-2xl text-2xl font-black shadow-[0_5px_0_#0f172a] active:translate-y-1 transition-all">{l}</button>
            ))}
          </div>
        </div>
      );
    }

    function BasicDictionary({ playTTS, getIcon }) {
      return (
        <div className="space-y-8 animate-fadeIn">
          {Object.entries(familyDictionary).map(([group, families]) => (
            <div key={group} className="bg-white rounded-2xl p-6 shadow-md border-b-4 border-purple-500">
              <h3 className="text-2xl font-black text-purple-800 border-b pb-2 mb-4">{group}</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {Object.entries(families).map(([fam, words]) => (
                  <div key={fam} className="bg-slate-50 p-4 rounded-xl">
                    <span className="bg-purple-100 text-purple-800 font-bold px-3 py-1 rounded text-sm">عائلة -{fam}</span>
                    <div className="mt-3 space-y-2">
                      {words.map((w, idx) => (
                        <div key={idx} className="bg-white p-3 rounded-lg flex justify-between items-center shadow-sm">
                          <div>
                            <span className="font-bold text-lg block">{w.word}</span>
                            <span className="text-sm text-slate-500">{w.meaning} • النطق التقريبي: [{w.sound}]</span>
                          </div>
                          <button onClick={() => playTTS(w.word)} className="bg-purple-100 p-2 rounded-full text-purple-700 hover:bg-purple-200 transition-colors">{getIcon('volume')}</button>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      );
    }

    function SpecialPatterns({ playTTS, getIcon }) {
      return (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 animate-fadeIn">
          {specialPatternsData.map((p, i) => (
            <div key={i} className="bg-white p-6 rounded-3xl shadow-md border-t-4 border-orange-500">
              <div className="flex justify-between mb-4">
                <span className="text-3xl font-black text-orange-600 font-mono">{p.pattern}</span>
                <span className="bg-orange-100 text-orange-800 px-3 py-1 rounded-xl font-bold">{p.sound}</span>
              </div>
              <p className="text-slate-600 mb-4 text-sm">{p.explanation}</p>
              {p.examples.map((ex, idx) => (
                <div key={idx} className="bg-slate-50 p-3 rounded-xl flex justify-between items-center mb-2">
                  <div>
                    <span className="font-bold block">{ex.word}</span>
                    <span className="text-xs text-slate-500">{ex.meaning} • [{ex.sound}]</span>
                  </div>
                  <button onClick={() => playTTS(ex.word)} className="bg-orange-100 p-2 rounded-full text-orange-600 hover:bg-orange-200 transition-colors">{getIcon('volume')}</button>
                </div>
              ))}
            </div>
          ))}
        </div>
      );
    }

    function PhraseBuilderGame({ playTTS, getIcon }) {
      const [lvl, setLvl] = useState(0);
      const [selected, setSelected] = useState([]);
      const [available, setAvailable] = useState([]);
      const [feedback, setFeedback] = useState(null);

      const currentLevel = phraseLevels[lvl];

      useEffect(() => {
        if (currentLevel) {
          setAvailable([...currentLevel.words]);
          setSelected([]);
          setFeedback(null);
        }
      }, [lvl]);

      const selectWord = (word, idx) => {
        setSelected([...selected, word]);
        setAvailable(available.filter((_, i) => i !== idx));
      };

      const removeWord = (word, idx) => {
        setAvailable([...available, word]);
        setSelected(selected.filter((_, i) => i !== idx));
      };

      const checkSentence = () => {
        const isCorrect = JSON.stringify(selected) === JSON.stringify(currentLevel.correct);
        if (isCorrect) {
          setFeedback('success');
          playTTS(currentLevel.correct.join(" "));
          setTimeout(() => {
            if (lvl + 1 < phraseLevels.length) setLvl(lvl + 1);
            else { alert("كفووو يا ماجد الأسطورة! أكملت كل مستويات تحدي تركيب الجمل!"); setLvl(0); }
          }, 2500);
        } else {
          setFeedback('error');
          setTimeout(() => setFeedback(null), 1500);
        }
      };

      if (!currentLevel) return null;

      return (
        <div className="bg-white rounded-3xl shadow-xl p-8 max-w-3xl mx-auto animate-fadeIn">
          <h2 className="text-3xl font-black text-center mb-4 text-emerald-600 flex justify-center items-center gap-2">
            <span>🎮</span> تحدي تركيب الجمل
          </h2>
          
          <div className="text-center text-lg bg-emerald-50 text-emerald-800 p-4 rounded-xl font-bold mb-8 flex items-center justify-between">
            <span className="text-right flex-1">رتب الكلمات لترجمة: {currentLevel.meaning}</span>
            {/* زر الصوت الذهبي التفاعلي الذي أضفناه لمساعدتك على الاستماع */}
            <button 
              onClick={() => playTTS(currentLevel.correct.join(" "))} 
              className="bg-emerald-500 text-white p-2 rounded-full hover:bg-emerald-600 transition-all shadow-md active:scale-90 ml-3 flex items-center justify-center"
              title="استمع للجملة الصحيحة"
            >
              {getIcon('volume')}
            </button>
          </div>
          
          <div className={`min-h-20 p-4 border-4 border-dashed rounded-2xl flex flex-wrap gap-2 items-center mb-6 ${feedback === 'success' ? 'border-green-500 bg-green-50' : feedback === 'error' ? 'border-red-500 bg-red-50' : 'border-slate-200 bg-slate-50'}`} dir="ltr">
            {selected.length === 0 && <span className="text-slate-400 font-bold mx-auto">اضغط على الكلمات بالأسفل لترتيبها هنا...</span>}
            {selected.map((w, i) => (
              <button key={i} onClick={() => removeWord(w, i)} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-xl text-lg transition-transform active:scale-95">{w}</button>
            ))}
          </div>

          <div className="flex flex-wrap gap-3 justify-center mb-8" dir="ltr">
            {available.map((w, i) => (
              <button key={i} onClick={() => selectWord(w, i)} className="bg-white border-2 border-slate-200 text-slate-800 font-bold px-4 py-2 rounded-xl text-lg shadow-sm hover:bg-slate-50 transition-all">{w}</button>
            ))}
          </div>

          {available.length === 0 && (
            <div className="text-center">
              <button onClick={checkSentence} className="bg-emerald-500 hover:bg-emerald-600 text-white font-black text-xl px-10 py-3 rounded-full shadow-lg transition-transform active:scale-95">التحقق من صحة الجملة</button>
            </div>
          )}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
